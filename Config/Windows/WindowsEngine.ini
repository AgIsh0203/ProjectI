[SystemSettings]
; UE 5.7 turns on software variable-rate shading with contrast-adaptive shading on Windows (BaseWindowsEngine.ini).
; Its image generator runs on the async compute queue every frame, and on the RX 7900 XTX (Adrenalin 26.8.1) the
; editor hung there twice on 18 Oct (DXGI_ERROR_DEVICE_HUNG, both times inside PrepareImageBasedVRS ->
; ContrastAdaptiveShading on AsyncCompute). Flat-colour art gains nothing from it.
r.VRS.EnableSoftware=0
r.VRS.ContrastAdaptiveShading=0
